name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [codex/**]

# AI Coding Factory — CI 真源（fail-closed）。
# 历史版本曾含 `echo OK` / `echo neutral` 的占位步骤；GPT 审核指出该 CI 是 fail-open，
# 现已全部替换为真实 fail-closed 命令。修改本文件需同步更新 scripts/check.ps1
# 与 docs/operations/development-environment.md 中的 CI 描述。
#
# 本机开发流程见 scripts/check.ps1（9 项门禁）；本 CI 是其镜像 + 跨平台扩展
# （ubuntu-latest 无法跑 Windows-only probe，因此 probe 在本机/Windows runner 上跑）。

jobs:
  plan-consistency:
    name: plan-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: pip install pytest
      - name: 计划一致性门禁
        # 真实 fail-closed：跑 plan_hash 与 event_hash 跨语言向量；
        # PLAN-HASH-001/EVENT-HASH-001 是 required-test-catalog 强制 ID，
        # fail 即整体红。
        run: |
          python -m pytest tests/contract/test_plan_hash_vectors.py tests/contract/test_event_hash_vectors.py -q --tb=short

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装测试依赖
        run: pip install pytest
      - name: Codegen drift 检测
        # 三语言生成树必须无漂移；漂移即整体红（fail-closed）。
        run: python contracts/codegen/generate.py --check
      - name: 合同测试
        # 全套合同测试（含 schema 有效性、golden vectors、catalog 47 ID、
        # receipt 聚合 fail-closed、compatibility manifest digest 绑定）。
        run: python -m pytest tests/contract/ -q

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 dev 依赖
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest
      - name: Ruff lint
        # pyproject.toml 已配 ruff；未跑过即视为 fail-closed 漏检。
        run: ruff check apps/agent/src scripts tests/contract tests/security
      - name: MyPy 类型检查
        # apps/agent 是受代码，必须 mypy 严格通过（fail-closed）。
        # 历史版本曾用 `strict || lax` 短路：严格失败仍走宽松分支通过，属 fail-open
        # 假绿（GPT 第四轮审核 item 6 指出）。现只跑严格模式，失败即整体红。
        run: mypy --config-file pyproject.toml apps/agent/src

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (workspace)
        # 含 factory-contracts + 5 个 compat-probe；编译失败即整体红。
        run: cargo check --workspace --all-targets
      - name: cargo test (factory-contracts)
        # 跨语言向量测试：Rust event_vectors + plan_vectors 必须与
        # contracts/golden/*.json 冻结值字节级一致。
        run: cargo test -p factory-contracts

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 启用 corepack + pnpm
        # corepack 自带 pnpm；pnpm 必须能离线/在线解析 package.json。
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate
      - name: 安装 frozen 依赖
        # fail-closed：frozen-lockfile 必须成功，否则依赖锁与 package.json 不一致。
        run: corepack pnpm install --frozen-lockfile
      - name: TypeScript 类型检查
        # tsc --noEmit 跑 .ts 类型一致性。
        run: corepack pnpm --filter @factory/contracts run lint
      - name: vitest 合同向量测试
        # event.test.ts + plan.test.ts 与 Rust/Python 共享同一 golden JSON，
        # 字节级一致 cross-language。
        run: corepack pnpm --filter @factory/contracts test

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 秘密扫描
        # _gate_checks.py secret-scan 已在本地 check.ps1 用过；CI 必须真跑
        # （不能再 echo OK）。任何命中即整体红。
        run: pip install pytest && python scripts/_gate_checks.py secret-scan
      - name: C 盘路径检查
        # 防止源代码硬编码 C:\ 路径或 %APPDATA%；命中即整体红。
        run: python scripts/_gate_checks.py c-drive-paths

  windows-probes:
    # Windows-only compat-probes 必须在 windows-latest 上真实执行 spike wrapper，
    # 判定按 receipt 的 status + subcheckId，绝不只看退出码（GPT 第五轮 REVISE
    # item 4：核心 wrapper 如 named_pipe/runner_identity 在 BLOCKED 时也 exit 0，
    # 只看退出码会让核心能力受阻仍绿）。规则：
    #   - 核心 spike（clock/durable-io/named-pipe/git-bridge/runner-identity）：
    #     receipt.status 必须 == PASS，任何 BLOCKED/FAIL 即整体红。
    #   - env-compat spike（sqlite_wal_full/tauri_e2e）：只有 receipt 的
    #     subcheckId（或 required 阻断 subResult 的 id）在冻结 allowlist 内时
    #     才允许 BLOCKED_UNCERTIFIED；否则整体红。
    name: windows-probes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 安装 pytest
        run: pip install pytest
      - name: 真实执行 compatibility spikes（按 receipt subcheckId fail-closed）
        shell: pwsh
        run: |
          # spike 名 -> wrapper；core = 必须 PASS，env-compat = 允许 allowlist BLOCKED。
          $spikes = [ordered]@{
            "clock_source"       = "test-clock-source"
            "windows_durable_io" = "test-durable-io"
            "named_pipe"         = "test-named-pipe"
            "git_object_bridge"  = "test-git-bridge"
            "runner_identity"    = "test-runner-identity"
            "sqlite_wal_full"    = "test-sqlite-wal"
            "tauri_e2e"          = "test-tauri-e2e"
          }
          $envCompat = @("sqlite_wal_full", "tauri_e2e")
          # 冻结 BLOCKED allowlist（与 PHASE_0_ACCEPTANCE.md §1 + phase0-acceptance.ps1 一致）。
          $allowlist = @(
            "spike:sqlite_wal_full/disk_full_enospc",
            "spike:tauri_e2e/webview_runtime"
          )
          $hardFail = $false
          foreach ($name in $spikes.Keys) {
            $script  = Join-Path "scripts/spikes" "$($spikes[$name]).ps1"
            $receipt = Join-Path "tools/compat-probes/$name" "receipt.json"
            if (-not (Test-Path $script)) {
              Write-Error "[$name] wrapper 缺失，fail-closed"; $hardFail = $true; continue
            }
            & pwsh -NoProfile -ExecutionPolicy Bypass -File $script | Out-Null
            if (-not (Test-Path $receipt)) {
              Write-Error "[$name] 未产出 receipt.json，fail-closed"; $hardFail = $true; continue
            }
            $obj = Get-Content $receipt -Raw -Encoding utf8 | ConvertFrom-Json
            $status = [string]$obj.status
            # 收集阻断 subcheckId：顶层 subcheckId + required 阻断的 subResult。
            $blockingIds = @()
            if ($obj.PSObject.Properties.Name -contains "subcheckId") { $blockingIds += [string]$obj.subcheckId }
            if ($obj.PSObject.Properties.Name -contains "subResults") {
              foreach ($sr in @($obj.subResults)) {
                $req = ($sr.PSObject.Properties.Name -contains "required") -and [bool]$sr.required
                if ($req -and ($sr.status -eq "BLOCKED_UNCERTIFIED" -or $sr.status -eq "FAIL")) {
                  $blockingIds += "spike:$name/$($sr.aspect)"
                }
              }
            }
            if ($status -eq "PASS") {
              Write-Host "[$name] status=PASS"
            } elseif ($status -eq "BLOCKED_UNCERTIFIED" -and ($envCompat -contains $name)) {
              $hit = @($blockingIds | Where-Object { $allowlist -contains $_ })
              if ($hit.Count -ge 1) {
                Write-Host "[$name] status=BLOCKED_UNCERTIFIED allowlisted ($($hit -join ','))"
              } else {
                Write-Error "[$name] BLOCKED 但 subcheckId 不在 allowlist（$($blockingIds -join ',')），fail-closed"
                $hardFail = $true
              }
            } else {
              Write-Error "[$name] status=$status（核心 spike 必须 PASS，或非 allowlist BLOCKED），fail-closed"
              $hardFail = $true
            }
          }
          if ($hardFail) { exit 1 }
      - name: 合同测试（Windows runner）
        run: python -m pytest tests/contract/ -q
# Windows 11 + WSL2 + Docker Desktop Linux-container 的唯一认证入口。
# 只接收本仓 codex/** push；公开仓库的 PR（含同仓）绝不调度 self-hosted runner。
name: runner-identity-certified

on:
  push:
    branches:
      - codex/**

permissions:
  contents: read

jobs:
  runner-identity-certified:
    # 这是唯一可以认证 Windows 11 + WSL2 + Docker Desktop Linux-container 语义的入口。
    # 公共仓库的 PR（即使来自同仓）都可能在 head 中改 workflow/脚本，故认证机只接受本仓
    # codex/* 分支 push；没有带专用标签的 runner 时 GitHub 保持 pending，绝不以 hosted
    # Windows、Ubuntu 或 allowlist 代替该认证。
    name: runner-identity-certified
    if: github.repository == 'geqian236/AI-Coding-Factory' && startsWith(github.ref, 'refs/heads/codex/')
    runs-on: [self-hosted, Windows, X64, acf-wsl2-linux, ephemeral]
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      FACTORY_TEST_DATA_ROOT: D:\codex项目\AI-Coding-Factory-Data\dev
      TEMP: D:\codex项目\AI-Coding-Factory-Data\dev\tmp
      TMP: D:\codex项目\AI-Coding-Factory-Data\dev\tmp
      CARGO_HOME: D:\codex项目\AI-Coding-Factory-Data\dev\cargo-home
      RUSTUP_HOME: D:\codex项目\AI-Coding-Factory-Data\dev\rustup-home
      EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
    steps:
      - name: 认证机 D 根路径前置（fail-closed）
        # 这是首个 step：runner 若错误安装在 C 盘，不能先 checkout/下载工具链再事后拒绝。
        # RUNNER_* 的真实位置只能由外部 runner 安装目录与 --work 配置保证，workflow 不伪造覆盖。
        shell: powershell
        run: |
          $approvedRoot = "D:\codex项目"
          # 认证机只能使用固定 D: 文件系统卷；SUBST、网络盘或未映射卷不能作为受控运行根。
          $dVolume = Get-CimInstance -ClassName Win32_LogicalDisk -Filter "DeviceID='D:'" -ErrorAction SilentlyContinue
          $dDrive = Get-PSDrive -Name D -PSProvider FileSystem -ErrorAction SilentlyContinue
          if ($null -eq $dVolume -or $dVolume.DriveType -ne 3 -or $null -eq $dDrive) {
            Write-Error "[runner_identity] D: 不是可验证的固定卷，拒绝认证"
            exit 1
          }

          function Assert-ApprovedRunnerPath([string]$Name, [string]$Value, [string]$Stage) {
            if ([string]::IsNullOrWhiteSpace($Value)) { throw "${Stage}: $Name is empty" }
            $full = [System.IO.Path]::GetFullPath($Value).TrimEnd('\')
            if ($full -cne $approvedRoot -and -not $full.StartsWith($approvedRoot + "\", [System.StringComparison]::OrdinalIgnoreCase)) {
              throw "${Stage}: $Name='$Value' is outside $approvedRoot"
            }

            # 先从末级回退到最近存在的祖先，再逐级检查 reparse；这样不存在的缓存目录
            # 也能在创建前证明其父链没有 junction/symlink 逃逸。
            $existing = $full
            while (-not (Test-Path -LiteralPath $existing)) {
              # Split-Path 的 LiteralPath/Parent 参数集在 Windows PowerShell 5.1 不兼容；
              # 改用 .NET，既不展开通配符，也能在盘符根目录返回空父级而 fail-closed。
              $parentInfo = [System.IO.Directory]::GetParent($existing)
              $parent = if ($null -eq $parentInfo) { "" } else { $parentInfo.FullName }
              if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $existing) {
                throw "${Stage}: $Name has no existing ancestor"
              }
              $existing = $parent
            }
            while ($true) {
              $item = Get-Item -LiteralPath $existing -Force -ErrorAction Stop
              if (($item.Attributes -band [System.IO.FileAttributes]::ReparsePoint) -ne 0) {
                throw "${Stage}: $Name reparse point detected at '$existing'"
              }
              if ($existing -ceq $approvedRoot) { break }
              $parentInfo = [System.IO.Directory]::GetParent($existing)
              $parent = if ($null -eq $parentInfo) { "" } else { $parentInfo.FullName }
              if ([string]::IsNullOrWhiteSpace($parent) -or $parent -eq $existing) {
                throw "${Stage}: $Name path escaped approved root"
              }
              $existing = $parent
            }
            return $full
          }

          # 外部 runner 管理的目录必须已存在；Factory 管理的缓存/临时目录仅在先验
          # D 根与 reparse 检查成功后才允许创建，创建后会立刻进行 post-create 复核。
          $paths = [ordered]@{
            RUNNER_TEMP = [string][Environment]::GetEnvironmentVariable("RUNNER_TEMP")
            RUNNER_TOOL_CACHE = [string][Environment]::GetEnvironmentVariable("RUNNER_TOOL_CACHE")
            GITHUB_WORKSPACE = [string][Environment]::GetEnvironmentVariable("GITHUB_WORKSPACE")
            CURRENT_WORKING_DIRECTORY = (Get-Location).Path
            TEMP = [string][Environment]::GetEnvironmentVariable("TEMP")
            TMP = [string][Environment]::GetEnvironmentVariable("TMP")
            FACTORY_TEST_DATA_ROOT = [string][Environment]::GetEnvironmentVariable("FACTORY_TEST_DATA_ROOT")
            CARGO_HOME = [string][Environment]::GetEnvironmentVariable("CARGO_HOME")
            RUSTUP_HOME = [string][Environment]::GetEnvironmentVariable("RUSTUP_HOME")
          }
          foreach ($entry in $paths.GetEnumerator()) {
            try {
              [void](Assert-ApprovedRunnerPath -Name $entry.Key -Value $entry.Value -Stage "pre-create")
            } catch {
              Write-Error "[runner_identity] $($_.Exception.Message)"
              exit 1
            }
          }

          foreach ($name in @("TEMP", "TMP", "FACTORY_TEST_DATA_ROOT", "CARGO_HOME", "RUSTUP_HOME")) {
            try {
              if (-not (Test-Path -LiteralPath $paths[$name])) {
                New-Item -ItemType Directory -Path $paths[$name] -Force -ErrorAction Stop | Out-Null
              }
              [void](Assert-ApprovedRunnerPath -Name $name -Value $paths[$name] -Stage "post-create")
            } catch {
              Write-Error "[runner_identity] $($_.Exception.Message)"
              exit 1
            }
          }
      # GitHub API 已将 actions/checkout v4 解析为该不可变 commit；避免标签被重定向。
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # 只 checkout event 的精确 SHA；后续前置检查再次从 Git 对比，双层拒绝漂移。
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: 认证前置：候选 SHA、WSL2 与 Docker Desktop Linux backend（fail-closed）
        # 在 setup action、工具链下载和 docker pull 前先验证认证机自身受控数据根与平台身份；
        # 只存在 docker CLI、Windows containers、非 Docker Desktop context 或 WSL1 均不能冒充。
        shell: powershell
        run: |
          . "$PWD/scripts/spikes/_runner-identity-platform.ps1"
          $platform = Test-RunnerIdentityPlatform -ExpectedCandidateSha $env:EXPECTED_CANDIDATE_SHA -RequireImage $false
          if (-not $platform.ok) {
            Write-Error "[runner_identity] 平台前置失败：$($platform.detail)"
            exit 1
          }
      - name: 验证受控 Python 3.12 与本机工具链入口（fail-closed）
        # 认证机由运维预装并锁定工具，不在 job 内隐式下载；盖章器只依赖 Python 标准库。
        shell: powershell
        run: |
          & python -c "import sys; raise SystemExit(0 if sys.version_info[:2] == (3, 12) else 3)"
          $pythonExit = $LASTEXITCODE
          if ($pythonExit -ne 0) {
            Write-Error "[runner_identity] 受控 python 不是 3.12.x 或不可用 exit=$pythonExit"
            exit 1
          }
          foreach ($tool in @("rustup", "cargo")) {
            $command = Get-Command -Name $tool -CommandType Application -ErrorAction SilentlyContinue
            if ($null -eq $command) {
              Write-Error "[runner_identity] 缺少受控工具 '$tool'，拒绝认证"
              exit 1
            }
          }
      - name: 预热 D-root GNU 工具链（认证前置，fail-closed）
        shell: powershell
        run: |
          & "$PWD/scripts/dev.ps1" -- -- rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[runner_identity] D-root GNU 工具链安装失败 exit=$LASTEXITCODE，fail-closed"
            exit 1
          }
      - name: 准备 self-hosted runner-identity Linux 容器镜像（fail-closed，认证前）
        shell: powershell
        run: |
          docker pull python:3.12-slim
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[runner_identity] 拉取 python:3.12-slim 失败 exit=$LASTEXITCODE，fail-closed"
            exit 1
          }
          docker image inspect python:3.12-slim
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[runner_identity] 验证本地 python:3.12-slim 失败 exit=$LASTEXITCODE，fail-closed"
            exit 1
          }
          . "$PWD/scripts/spikes/_runner-identity-platform.ps1"
          $platform = Test-RunnerIdentityPlatform -ExpectedCandidateSha $env:EXPECTED_CANDIDATE_SHA -RequireImage $true
          if (-not $platform.ok) {
            Write-Error "[runner_identity] pull 后平台/image 身份验证失败：$($platform.detail)"
            exit 1
          }
      - name: 执行并验证 runner_identity 真认证（Windows+WSL2+Linux Docker）
        shell: powershell
        run: |
          $receiptPath = "tools/compat-probes/runner_identity/receipt.json"
          # 先 purge 再运行，禁止历史 PASS receipt 被本轮盖章或 validator 复用。
          if (Test-Path -LiteralPath $receiptPath) {
            Remove-Item -LiteralPath $receiptPath -Force -ErrorAction Stop
          }
          if (Test-Path -LiteralPath $receiptPath) {
            Write-Error "[runner_identity] 历史 receipt 无法清除，拒绝复用"
            exit 1
          }
          $env:SPIKE_RUN_ID = [guid]::NewGuid().ToString()
          $env:SPIKE_RUN_NONCE = -join ((1..32) | ForEach-Object { '{0:x}' -f (Get-Random -Max 16) })
          $env:SPIKE_CANDIDATE_SHA = $env:EXPECTED_CANDIDATE_SHA
          $runStart = Get-Date
          & powershell -NoProfile -ExecutionPolicy Bypass -File "scripts/spikes/test-runner-identity.ps1"
          $wrapperExit = $LASTEXITCODE
          # wrapper 的 native 退出码必须紧邻真实调用后捕获并立即拒绝；不能先读旧 receipt、
          # 算摘要或盖章，否则失败 wrapper 仍可能推动后续副作用并掩盖原始失败证据。
          if ($null -eq $wrapperExit -or $wrapperExit -ne 0) {
            Write-Error "[runner_identity] wrapper exit=$wrapperExit，拒绝认证"
            exit 1
          }
          if (-not (Test-Path -LiteralPath $receiptPath)) {
            Write-Error "[runner_identity] wrapper 未写 receipt，fail-closed"
            exit 1
          }
          $preStampMtime = (Get-Item -LiteralPath $receiptPath).LastWriteTime

          # 用 wrapper 的同一 per-worktree target 推导真实 exe，digest 绑定的是已执行的
          # probe 二进制而非仓库源码；exe 缺失或摘要计算失败均拒绝继续。
          $worktreeRoot = (Get-Location).Path
          $dataRoot = "D:\codex项目\AI-Coding-Factory-Data\dev"
          . "$PWD/scripts/_worktree-target.ps1"
          $targetDir = Get-WorktreeTargetDir -WorktreeRoot $worktreeRoot -DataRoot $dataRoot
          $probePath = Join-Path $targetDir "debug\runner_identity.exe"
          if (-not (Test-Path -LiteralPath $probePath)) {
            Write-Error "[runner_identity] 已执行 probe 二进制缺失 '$probePath'，拒绝盖章"
            exit 1
          }
          $probeDigest = "sha256:" + (Get-FileHash -Algorithm SHA256 -LiteralPath $probePath).Hash.ToLowerInvariant()
          # stamp_run_binding.py 仅依赖标准库；使用已在前置锁定为 3.12 的受控 Python，避免
          # 认证 job 为盖章器临时创建 venv 或联网安装依赖。
          python scripts/spikes/stamp_run_binding.py $receiptPath runner_identity --probe-digest $probeDigest
          if ($LASTEXITCODE -ne 0) {
            Write-Error "[runner_identity] receipt 盖章失败，拒绝认证"
            exit 1
          }
          . "$PWD/scripts/spikes/_receipt-validator.ps1"
          $v = Test-SpikeReceiptEvidence -Name "runner_identity" -Path $receiptPath -EnvCompat $false `
            -Allowlist @() -RunStart $runStart -ReceiptMtime $preStampMtime -WrapperExitCode $wrapperExit `
            -ExpectRunId $env:SPIKE_RUN_ID -ExpectRunNonce $env:SPIKE_RUN_NONCE `
            -ExpectCandidateSha $env:SPIKE_CANDIDATE_SHA -ExpectProbeDigest $probeDigest
          if (-not $v.ok -or $v.status -ne "PASS") {
            Write-Error "[runner_identity] receipt/probe 绑定失败 status=$($v.status): $($v.detail)"
            exit 1
          }
          Write-Host "[runner_identity] CERTIFIED PASS: run=$env:SPIKE_RUN_ID probe=$probeDigest"

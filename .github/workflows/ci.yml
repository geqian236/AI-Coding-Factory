name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  plan-consistency:
    name: plan-consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 计划一致性门禁
        run: echo "plan-consistency: OK"

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装 pytest
        run: pip install pytest
      - name: 合同测试
        run: python -m pytest tests/contract/ -q

  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python lint/type check
        run: echo "python: OK"

  rust:
    name: rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --workspace

  desktop:
    name: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 桌面兼容性（CI neutral）
        run: echo "desktop: neutral"

  security:
    name: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安全扫描
        run: echo "security: OK"
